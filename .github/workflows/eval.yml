name: Eval

# Golden-answer eval (SCRUM-39). Runs when the model settings, the prompt, the agent or the
# tools change, and on demand from the Actions tab.
#
# - The offline model needs no key and must score 100%: it checks that the harness, the tools
#   on the frozen snapshot, grounding and the disclaimer still agree with the golden answers.
# - The real model runs when the repository secret EVAL_LLM_API_KEY is set (a Groq key by
#   default; set the variables EVAL_LLM_PROVIDER and EVAL_LLM_MODEL to use another provider).
# Results are kept in the Actions cache, so each run is compared with the previous one.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Which model to evaluate
        type: choice
        options: [configured, offline]
        default: configured
      cases:
        description: Comma-separated case ids (empty for all)
        type: string
        required: false
  pull_request:
    paths:
      - backend/stock_api/agent/**
      - backend/stock_api/llm/**
      - backend/stock_api/config.py
      - mcp_server/financial_mcp/**
      - evals/**
      - .github/workflows/eval.yml
  push:
    branches: [main]
    paths:
      - backend/stock_api/agent/**
      - backend/stock_api/llm/**
      - backend/stock_api/config.py
      - mcp_server/financial_mcp/**
      - evals/**
      - .github/workflows/eval.yml

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: Golden-answer eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_MODEL_KEY: ${{ secrets.EVAL_LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            mcp_server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore earlier results
        uses: actions/cache/restore@v4
        with:
          path: evals/results
          key: eval-results-${{ github.run_id }}
          restore-keys: eval-results-

      - name: Offline model (harness, tools and scoring)
        if: github.event_name != 'workflow_dispatch' || inputs.model == 'offline'
        run: python -m evals --model offline --min-score 1.0

      - name: Real model
        if: >-
          env.HAS_MODEL_KEY == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.model == 'configured')
        env:
          LLM_PROVIDER: ${{ vars.EVAL_LLM_PROVIDER || 'groq' }}
          LLM_MODEL: ${{ vars.EVAL_LLM_MODEL || 'openai/gpt-oss-120b' }}
          LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
          LLM_FALLBACK_PROVIDER: ""
          CASES: ${{ inputs.cases }}
        run: |
          args=(--model configured --delay 2)
          if [ -n "$CASES" ]; then args+=(--cases "$CASES"); fi
          python -m evals "${args[@]}"

      - name: Note when the real model was skipped
        if: env.HAS_MODEL_KEY != 'true'
        run: >-
          echo "::notice::Real-model eval skipped: add the repository secret EVAL_LLM_API_KEY
          to run it."

      - name: Keep results for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evals/results
          key: eval-results-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results
          if-no-files-found: ignore
