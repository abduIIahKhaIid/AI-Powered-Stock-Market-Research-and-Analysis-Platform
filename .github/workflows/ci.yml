name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Real Postgres for the job store and audit log tests.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real Redis for the live job progress (pub/sub) test.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            mcp_server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check backend mcp_server sandbox evals

      - name: Type check (mypy)
        run: mypy backend mcp_server sandbox evals

      - name: Tests (pytest)
        run: pytest

  sandbox:
    name: Sandbox (image, escape tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            mcp_server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the sandbox image
        run: docker build -t stock-sandbox:test sandbox/image

      - name: Escape tests against real containers
        env:
          SANDBOX_DOCKER_TESTS: "1"
          SANDBOX_IMAGE: stock-sandbox:test
        run: pytest sandbox/tests -v

      - name: No sandbox containers are left behind
        run: test -z "$(docker ps -aq --filter label=stock-platform.sandbox=1)"

  security:
    name: Security (secrets, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: No secrets in tracked files
        run: python scripts/check_secrets.py

      - name: Python dependencies have no known vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off \
            -r backend/requirements.txt -r mcp_server/requirements.txt \
            -r sandbox/runner/requirements.txt -r sandbox/image/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web app dependencies have no high or critical vulnerabilities (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Development tools (reported, not blocking)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found advisories in development-only packages; see the log."

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Type check and build
        run: npm run build

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Only Nginx publishes a port
        run: |
          docker compose config --format json > compose.json
          python3 - <<'PY'
          import json
          services = json.load(open("compose.json"))["services"]
          published = sorted(name for name, service in services.items() if service.get("ports"))
          print("services with published ports:", published)
          assert published == ["nginx"], published
          PY

      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 240 postgres redis mcp api frontend nginx

      - name: Check /health through Nginx reports every service as ok
        run: |
          curl -fsS http://127.0.0.1:8080/api/health | tee health.json
          python3 -c "import json,sys; h=json.load(open('health.json')); sys.exit(0 if h['status']=='ok' else 1)"

      - name: Sign-in works end to end and the API refuses requests without it
        run: |
          set -e
          base=http://127.0.0.1:8080/api
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/analyses)" = 401
          token=$(curl -fsS -X POST $base/auth/register -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","password":"ci-password-123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS $base/auth/me -H "Authorization: Bearer $token"
          curl -fsS $base/analyses -H "Authorization: Bearer $token"
          curl -fsS -o /dev/null http://127.0.0.1:8080/

      - name: Sandbox runner runs code in a fresh container
        run: |
          docker compose up -d sandbox
          docker compose exec -T sandbox python - < sandbox/smoke.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
