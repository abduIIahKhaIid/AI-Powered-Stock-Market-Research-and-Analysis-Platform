# Local development stack. Start everything with:  docker compose up --build
# Then open http://localhost:8080. Only Nginx publishes a port (bound to 127.0.0.1, so it is
# reachable only from this computer); every other service is internal (SCRUM-40).
# To reach Postgres, Redis, the API or the MCP server directly while debugging:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
      POSTGRES_DB: ${POSTGRES_DB:-stock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: ./mcp_server
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8100"
      MCP_CACHE_DIR: /home/appuser/.cache/financial_mcp
    volumes:
      - mcpcache:/home/appuser/.cache/financial_mcp
    # Redis caches tool results; Postgres keeps ohlcv_daily and financial_facts (SCRUM-23).
    # Both are optional at runtime: the tools still answer if either is down.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    # Apply the database migrations (backend/migrations), then start the API.
    # Behind Nginx: --proxy-headers takes the client address from X-Forwarded-For, which Nginx
    # sets (only Nginx can reach this port).
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn stock_api.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JOB_RESULTS_DIR: /data/job-results
      # uvicorn --reload polls, because Windows bind mounts send no file events.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - jobresults:/data/job-results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: ["celery", "-A", "stock_api.worker", "worker", "-Q", "analysis,sandbox,ingest", "--loglevel=info"]
    env_file: .env
    environment:
      JOB_RESULTS_DIR: /data/job-results
      SANDBOX_URL: http://sandbox:8200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - jobresults:/data/job-results
    networks:
      - default
      - sandbox
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  beat:
    build: ./backend
    command: ["celery", "-A", "stock_api.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  # Builds the image each analysis run starts from (pandas, numpy, scipy, statsmodels, ta).
  # It exits at once; the runner starts one container from it per run.
  sandbox-image:
    build: ./sandbox/image
    image: stock-sandbox:latest
    entrypoint: ["python", "-c", "print('sandbox image ready')"]
    network_mode: none
    restart: "no"

  # Sandbox Runner: the only service with the Docker socket. It is reachable only from the
  # worker, over the internal sandbox network, and has no published port.
  sandbox:
    build: ./sandbox/runner
    environment:
      SANDBOX_IMAGE: stock-sandbox:latest
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Golden-answer eval (SCRUM-39). Runs only on demand, on the frozen market snapshot:
  #   docker compose run --rm evals                       (offline model, no key needed)
  #   docker compose run --rm evals --model configured    (the LLM set in .env)
  evals:
    build: ./backend
    profiles: ["tools"]
    entrypoint: ["python", "-m", "evals"]
    env_file: .env
    working_dir: /repo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/repo/backend:ro
      - ./mcp_server:/repo/mcp_server:ro
      - ./evals:/repo/evals

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      # Windows bind mounts send no file events: poll so edits and git pulls show up.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

  # The only service with a published port: the web app at / and the API at /api (SCRUM-40).
  # Runs as an unprivileged user. HTTP_PORT in .env changes the port (default 8080).
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  # Internal only: no route to the internet or the host.
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
  mcpcache:
  jobresults:
