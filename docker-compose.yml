# Local development stack. Start everything with:  docker compose up --build
# Ports are bound to 127.0.0.1 so they are reachable only from this computer.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
      POSTGRES_DB: ${POSTGRES_DB:-stock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: ./mcp_server
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8100"
      MCP_CACHE_DIR: /home/appuser/.cache/financial_mcp
    volumes:
      - mcpcache:/home/appuser/.cache/financial_mcp
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    command: ["uvicorn", "stock_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JOB_RESULTS_DIR: /data/job-results
    volumes:
      - ./backend:/app
      - jobresults:/data/job-results
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: ["celery", "-A", "stock_api.worker", "worker", "-Q", "analysis,sandbox,ingest", "--loglevel=info"]
    env_file: .env
    environment:
      JOB_RESULTS_DIR: /data/job-results
      SANDBOX_URL: http://sandbox:8200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - jobresults:/data/job-results
    networks:
      - default
      - sandbox
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  beat:
    build: ./backend
    command: ["celery", "-A", "stock_api.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  # Builds the image each analysis run starts from (pandas, numpy, scipy, statsmodels, ta).
  # It exits at once; the runner starts one container from it per run.
  sandbox-image:
    build: ./sandbox/image
    image: stock-sandbox:latest
    entrypoint: ["python", "-c", "print('sandbox image ready')"]
    network_mode: none
    restart: "no"

  # Sandbox Runner: the only service with the Docker socket. It is reachable only from the
  # worker, over the internal sandbox network, and has no published port.
  sandbox:
    build: ./sandbox/runner
    environment:
      SANDBOX_IMAGE: stock-sandbox:latest
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

networks:
  # Internal only: no route to the internet or the host.
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
  mcpcache:
  jobresults:
